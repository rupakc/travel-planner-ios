# XcodeGen spec (pinned version in tools.lock). `scripts/ci/generate.sh` writes Voyager.xcodeproj,
# which is never committed. All code lives in Packages/VoyagerKit; the app links only AppShell.
name: Voyager

options:
  bundleIdPrefix: io.github.rupakc
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  VoyagerKit:
    path: Packages/VoyagerKit

targets:
  Voyager:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        # XcodeGen's iOS preset sets CODE_SIGN_IDENTITY at target level, above the xcconfig.
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    dependencies:
      - package: VoyagerKit
        product: AppShell
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Voyager
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, de, fr, hi, zh-Hans, bn]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        VoyagerBaseURL: $(VOYAGER_BASE_URL)
        VoyagerTrustedHosts: $(VOYAGER_TRUSTED_HOSTS)
        CFBundleURLTypes:
          - CFBundleURLName: io.github.rupakc.travelplanner
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [voyager]

  VoyagerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Voyager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rupakc.travelplanner.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Voyager
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"

schemes:
  Voyager:
    build:
      targets:
        Voyager: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  VoyagerUI:
    build:
      targets:
        Voyager: [test, run]
        VoyagerUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - VoyagerUITests
